<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Аквариум Роберта 🐠</title>
<style>
:root { --water1:#19d5f7; --water2:#069bd6; --water3:#045f9e; --sand:#e8d18b; --yellow:#ffd337; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#0a8fc8; }
button { font:inherit; border:0; }
.screen { position:fixed; inset:0; width:100%; height:100%; }
.hidden { display:none !important; }

/* START */
#start { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px; overflow:hidden; background:linear-gradient(180deg,var(--water1),var(--water2) 50%,var(--water3)); }
#start::after { content:""; position:absolute; inset:auto 0 0; height:20%; background:linear-gradient(transparent,rgba(0,50,80,.15)); pointer-events:none; }
.sun { position:absolute; top:-8%; width:26vw; height:110%; background:linear-gradient(180deg,rgba(255,255,255,.23),transparent); filter:blur(13px); transform:rotate(14deg); opacity:.8; }
.s1 { left:13%; } .s2 { left:47%; transform:rotate(-10deg); } .s3 { right:5%; transform:rotate(8deg); }
.b { position:absolute; border:2px solid rgba(255,255,255,.58); border-radius:50%; background:rgba(255,255,255,.16); animation:rise 5s ease-in-out infinite; }
.b1 { width:30px;height:30px;left:8%;bottom:13%; } .b2 { width:55px;height:55px;right:8%;bottom:23%;animation-delay:1s; } .b3 { width:18px;height:18px;left:23%;top:16%;animation-delay:2s; } .b4 { width:36px;height:36px;right:23%;top:22%;animation-delay:.7s; }
@keyframes rise { 50%{transform:translateY(-48px)} }
.logo { position:relative;z-index:2;margin:0 0 20px;color:#fff;text-align:center;font-weight:900;font-size:clamp(30px,8.5vw,60px);text-shadow:3px 4px 0 #04527f,0 8px 18px rgba(0,0,0,.22); }
#startButton { position:relative;z-index:2;padding:0;background:none;cursor:pointer;width:min(72vw,390px);touch-action:manipulation;animation:pulse 1.8s ease-in-out infinite; }
#startButton img { width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:8px solid #fff;box-shadow:0 0 0 8px var(--yellow),0 18px 42px rgba(0,0,0,.35);display:block; }
@keyframes pulse { 50% { transform:scale(1.045); } }
.hint { position:relative;z-index:2;margin-top:28px;padding:14px 22px;color:#fff;background:#ff9f1c;border-radius:999px;font-weight:900;font-size:clamp(21px,5.5vw,31px);box-shadow:0 6px 0 #d66e00; }

/* AQUARIUM */
#game { display:none; background:linear-gradient(180deg,var(--water1),var(--water2) 46%,var(--water3)); overflow:hidden; }
#game::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 58% 10%,rgba(255,255,255,.33),transparent 26%),linear-gradient(110deg,rgba(255,255,255,.18),transparent 34%); pointer-events:none; }
.topbar { position:absolute;z-index:20;left:12px;right:12px;top:12px;display:flex;justify-content:space-between; }
.icon { width:58px;height:58px;border-radius:50%;background:#128ddd;color:#fff;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,65,100,.35);font-size:27px;cursor:pointer;touch-action:manipulation; }
.title { position:absolute;z-index:10;left:50%;top:14px;transform:translateX(-50%);width:min(72vw,620px);padding:10px 16px;background:#7b4a1f;color:#fff;border:6px solid #d7a45d;border-radius:24px;text-align:center;font-size:clamp(22px,5.8vw,42px);font-weight:900;text-shadow:2px 3px 0 #533116;box-shadow:0 7px 0 rgba(68,38,16,.32); }
.aqua { position:absolute;inset:0;overflow:hidden; }
.beam { position:absolute;top:-5%;height:70%;width:26vw;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);filter:blur(11px);transform:rotate(14deg); }
.beam.a {left:16%} .beam.b {left:53%;transform:rotate(-11deg)} .beam.c {right:4%;transform:rotate(8deg)}
.floating { position:absolute; font-size:clamp(30px,7vw,60px); animation:drift 6s ease-in-out infinite; user-select:none; }
@keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(16px,-12px)} }
.plant { position:absolute;bottom:88px;width:22px;border-radius:100% 0 90% 20%;background:linear-gradient(90deg,#0b6f45,#34c86e);transform-origin:bottom; }
.p1 {left:7%;height:145px;transform:rotate(-14deg)} .p2 {left:12%;height:125px;transform:rotate(18deg)} .p3 {right:10%;height:155px;transform:rotate(-13deg)} .p4 {right:15%;height:122px;transform:rotate(15deg)}
.coral { position:absolute;bottom:48px;width:92px;height:68px;border-radius:60% 60% 22% 22%;background:linear-gradient(135deg,#ff6ec7,#9d55e5);box-shadow:10px -7px 0 #ff86d0,-10px -6px 0 #a55fe7; }
.c1 {left:22%;transform:scale(.78)} .c2 {right:23%;transform:scale(.86)}
.rock { position:absolute;bottom:49px;width:115px;height:64px;border-radius:60% 60% 40% 35%;background:linear-gradient(#8397a3,#4c606b);box-shadow:inset 12px 10px 16px rgba(255,255,255,.12); }
.rk1{left:2%} .rk2{right:2%;transform:scale(.9)}
.sand {position:absolute;left:-5%;right:-5%;bottom:-4px;height:100px;background:linear-gradient(#ead493,#caa75b);border-radius:50% 50% 0 0;box-shadow:inset 0 12px 15px rgba(255,255,255,.2); }
.fish { position:absolute;z-index:8;width:clamp(150px,30vw,250px);cursor:pointer;touch-action:manipulation;animation:fishSwim 5s ease-in-out infinite;filter:drop-shadow(0 9px 7px rgba(0,0,0,.18)); }
.fish:active { transform:scale(1.12); }
.f1 {left:10%;top:30%} .f2{right:8%;top:44%;animation-delay:1s} .f3{left:40%;top:22%;animation-delay:2s} .f4{right:30%;top:63%;animation-delay:3s}
@keyframes fishSwim {0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(18px,-12px) rotate(2deg)}}
.fish .fish-svg { width:100%;height:auto;display:block; }
.fish-pop { animation:pop .45s ease; }
@keyframes pop { 50% { transform:scale(1.22) rotate(3deg); } }
.bubblePop { position:absolute;z-index:9;font-size:30px;pointer-events:none;animation:bPop .8s ease forwards; }
@keyframes bPop { 0%{opacity:0;transform:translateY(0) scale(.5)} 20%{opacity:1} 100%{opacity:0;transform:translateY(-80px) scale(1.2)} }
.badge {position:absolute;z-index:15;left:15px;bottom:16px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:27px;background:rgba(0,73,120,.74);backdrop-filter:blur(7px);color:#fff;}
.badge img{width:62px;height:62px;border:3px solid #fff;border-radius:50%;object-fit:cover} .badge strong{font-size:18px}
.newBtn {position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);min-width:min(86vw,430px);padding:18px 28px;background:linear-gradient(#ffe45e,#ffbf17);border-radius:999px;color:#0a5da0;font-size:clamp(22px,5.7vw,33px);font-weight:900;box-shadow:0 8px 0 #bd8100;cursor:pointer;touch-action:manipulation;}
.newBtn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 3px 0 #bd8100}

/* COLORING */
#coloring {display:none;background:linear-gradient(180deg,#20d3f7,#0aa4dc 55%,#006ca8);overflow:hidden;color:#fff;text-align:center;}
.colorTitle {margin:16px auto 0;font-size:clamp(28px,7vw,50px);font-weight:900;text-shadow:3px 4px 0 #045b83;}
.palette {position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(94vw,760px);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.color {width:56px;height:56px;border-radius:50%;border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer;touch-action:manipulation;}
.color.selected {outline:5px solid #fff;outline-offset:4px;transform:scale(1.08)}
.finish {width:min(86vw,430px);padding:17px 26px;border-radius:50px;background:#ffcf2f;color:#5c4100;font-size:clamp(23px,6vw,34px);font-weight:900;box-shadow:0 7px 0 #bc8600;cursor:pointer;}
.fish-stage {position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(78vw,460px);}
.big-svg {width:100%;height:auto;filter:drop-shadow(0 14px 10px rgba(0,0,0,.2));}
.part {cursor:pointer;touch-action:manipulation;transition:filter .15s}
.part:active {filter:brightness(1.15)}
.part.flash {animation:flash .3s ease}
@keyframes flash {50%{filter:brightness(1.5)}}
.helper {position:absolute;z-index:3;top:95px;left:50%;transform:translateX(-50%);width:min(90vw,620px);font-size:clamp(20px,5.2vw,30px);font-weight:800;background:rgba(255,255,255,.16);padding:10px 15px;border-radius:20px}

@media(max-height:650px){#startButton{width:min(48vh,280px)} .hint{margin-top:14px;font-size:19px} .title{top:8px} .newBtn{bottom:10px;padding:14px 22px} .fish-stage{top:43%} .helper{top:76px} .color{width:48px;height:48px}}
</style>
</head>

<script>
const start = document.getElementById('start');
const game = document.getElementById('game');
const coloring = document.getElementById('coloring');
const music = document.getElementById('music');
const startButton = document.getElementById('startButton');
const soundBtn = document.getElementById('soundBtn');
const homeBtn = document.getElementById('homeBtn');
const newFish = document.getElementById('newFish');
const backBtn = document.getElementById('backBtn');
const finishFish = document.getElementById('finishFish');
const fishLayer = document.getElementById('fishLayer');
let selectedColor = '#ff9f1c';

const COLORS = ['#ff9f1c','#ff4d5f','#ffd335','#53d56a','#37b9f2','#8d6cff','#ff7acb'];
const stored = JSON.parse(localStorage.getItem('robertAquariumColors') || '[]');
let collected = stored.length ? stored : ['#37b9f2','#ffd335','#ff7acb'];

function fishSVG(color) {
  return `<svg class="fish-svg" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="120" cy="75" rx="73" ry="46" fill="${color}" stroke="#fff" stroke-width="6"/>
    <path d="M55 75 L18 42 L18 108 Z" fill="#7ee8ff" stroke="#fff" stroke-width="6"/>
    <path d="M115 33 Q140 4 160 34 Q145 49 115 33Z" fill="#ff73bd" stroke="#fff" stroke-width="6"/>
    <circle cx="155" cy="64" r="11" fill="#fff" stroke="#333" stroke-width="4"/><circle cx="157" cy="64" r="5" fill="#333"/>
    <path d="M168 88 Q185 99 196 86" fill="none" stroke="#7b2b2b" stroke-width="6" stroke-linecap="round"/>
    <path d="M118 118 Q136 143 157 119 Q138 110 118 118Z" fill="#63df86" stroke="#fff" stroke-width="6"/>
  </svg>`;
}

function renderAquarium() {
  fishLayer.innerHTML = '';
  const positions = [
    ['left:8%;top:31%;','f1'],
    ['right:8%;top:44%;','f2'],
    ['left:39%;top:23%;','f3'],
    ['right:27%;top:62%;','f4'],
    ['left:25%;top:55%;','f3']
  ];
  collected.forEach((color, i) => {
    const [pos, cls] = positions[i % positions.length];
    const el = document.createElement('div');
    el.className = `fish ${cls}`;
    el.style.cssText = pos;
    el.innerHTML = fishSVG(color);
    el.dataset.index = i;
    el.addEventListener('pointerdown', () => {
      el.classList.remove('fish-pop');
      void el.offsetWidth;
      el.classList.add('fish-pop');
      spawnBubbles(el);
    });
    fishLayer.appendChild(el);
  });
}

function spawnBubbles(el) {
  for(let i=0;i<3;i++) {
    const b = document.createElement('div');
    b.className = 'bubblePop';
    b.textContent = '🫧';
    const r = el.getBoundingClientRect();
    b.style.left = (r.left + r.width*0.55) + 'px';
    b.style.top = (r.top + 10 + i*8) + 'px';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),800);
  }
}

async function startGame() {
  try {
    music.volume = 0.8;
    await music.play();
  } catch (e) {
    // На некоторых браузерах звук разрешается только после жеста — это нажатие и есть жест.
    console.log('music:', e);
  }
  start.style.opacity = '0';
  start.style.transform = 'scale(1.02)';
  setTimeout(() => {
    start.style.display = 'none';
    game.style.display = 'block';
    renderAquarium();
  }, 450);
}

startButton.addEventListener('pointerup', startGame, {once:true});

soundBtn.addEventListener('pointerup', async () => {
  if (music.paused) {
    try { await music.play(); } catch(e) { console.log(e); }
    soundBtn.textContent = '🔊';
  } else {
    music.pause();
    soundBtn.textContent = '🔇';
  }
});

homeBtn.addEventListener('pointerup', () => {
  game.style.display = 'none';
  coloring.style.display = 'none';
  start.style.display = 'flex';
  start.style.opacity = '1';
  start.style.transform = 'scale(1)';
  soundBtn.textContent = '🔊';
  startButton.disabled = false;
  // Поскольку стартовая кнопка уже имеет once-слушатель, возвращаем обработчик.
  startButton.addEventListener('pointerup', startGame, {once:true});
});

newFish.addEventListener('pointerup', () => {
  game.style.display = 'none';
  coloring.style.display = 'block';
});

backBtn.addEventListener('pointerup', () => {
  coloring.style.display = 'none';
  game.style.display = 'block';
  renderAquarium();
});

document.querySelectorAll('.color').forEach(btn => btn.addEventListener('pointerup', () => {
  selectedColor = btn.dataset.color;
  document.querySelectorAll('.color').forEach(x => x.classList.remove('selected'));
  btn.classList.add('selected');
}));

document.querySelectorAll('.part').forEach(part => part.addEventListener('pointerup', () => {
  part.setAttribute('fill', selectedColor);
  part.classList.remove('flash');
  void part.offsetWidth;
  part.classList.add('flash');
}));

finishFish.addEventListener('pointerup', () => {
  collected.push(selectedColor);
  localStorage.setItem('robertAquariumColors', JSON.stringify(collected));
  coloring.style.display = 'none';
  game.style.display = 'block';
  renderAquarium();
});

renderAquarium();
</script>
</body>
</html>
